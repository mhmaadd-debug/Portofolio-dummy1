<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadia Larasati, S.Ak. — Accounting & Tax Portfolio</title>
    <!-- Google Fonts: Pixel & Monospace & Clean Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --retro-bg: #F9ECEC;
            --retro-border: #231F20;
            --retro-blue: #3A7CA5;
            --retro-pink: #E5989B;
            --retro-teal: #2A9D8F;
            --retro-sage: #84A59D;
            --retro-cream: #FDF8F2;
            --key-dark: #363F4A;
            --key-shadow: #1E232A;
            --font-pixel: 'Silkscreen', 'Courier New', monospace;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            background-color: var(--retro-bg);
            color: var(--retro-border);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        ::selection {
            background-color: var(--retro-pink);
            color: var(--retro-border);
        }

        /* Utility State Classes untuk JavaScript */
        .hidden { display: none !important; }
        .flex { display: flex !important; }

        /* Typography Helpers */
        .font-pixel { font-family: var(--font-pixel); }
        .font-mono { font-family: var(--font-mono); }
        .font-sans { font-family: var(--font-sans); }

        /* Custom Retro Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #F9ECEC; border-left: 2px solid #231F20; }
        ::-webkit-scrollbar-thumb { background: #E5989B; border: 2px solid #231F20; }

        /* Retro Browser Windows */
        .retro-window {
            border: 2.5px solid #231F20;
            box-shadow: 6px 6px 0px #231F20;
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .retro-window-colored-shadow-blue {
            border: 2.5px solid #231F20;
            box-shadow: 7px 7px 0px #D64527;
            border-radius: 6px;
            overflow: hidden;
        }
        .retro-window-colored-shadow-pink {
            border: 2.5px solid #231F20;
            box-shadow: 7px 7px 0px #8B1E3F;
            border-radius: 6px;
            overflow: hidden;
        }
        .retro-window-colored-shadow-teal {
            border: 2.5px solid #231F20;
            box-shadow: 7px 7px 0px #F4A261;
            border-radius: 6px;
            overflow: hidden;
        }
        .retro-window-colored-shadow-sage {
            border: 2.5px solid #231F20;
            box-shadow: 7px 7px 0px #B56576;
            border-radius: 6px;
            overflow: hidden;
        }

        /* Checkerboard Pattern */
        .checkerboard {
            background-color: #ffffff;
            background-image:
                linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
                linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
                linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }

        /* Pixel Keycap Style */
        .pixel-keycap {
            background-color: #363F4A;
            color: #FFFFFF;
            border: 2px solid #1E232A;
            border-top-color: #5C6B7C;
            border-left-color: #5C6B7C;
            box-shadow: 0 4px 0 #1E232A;
            transition: all 0.08s ease;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
        }
        .pixel-keycap:hover {
            background-color: #434E5C;
            transform: translateY(-1px);
        }
        .pixel-keycap:active, .pixel-keycap.active-key {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1E232A;
            background-color: #2A9D8F;
            border-top-color: #1E232A;
        }

        /* Vintage Ticket */
        .vintage-ticket {
            position: relative;
            border: 2px solid #231F20;
            box-shadow: 5px 5px 0px #231F20;
            background-image: radial-gradient(rgba(35, 31, 32, 0.06) 1px, transparent 0);
            background-size: 10px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Barcode & Loading Bar */
        .barcode-strip {
            height: 28px;
            width: 96px;
            background: repeating-linear-gradient(
                90deg,
                #231F20, #231F20 2px, transparent 2px, transparent 4px,
                #231F20 4px, #231F20 5px, transparent 5px, transparent 8px,
                #231F20 8px, #231F20 11px, transparent 11px, transparent 13px
            );
        }
        .loading-segments {
            background: repeating-linear-gradient(
                90deg,
                #FFFFFF 0px, #FFFFFF 6px, #231F20 6px, #231F20 8px
            );
        }

        /* =========================================================
           HEADER & NAVIGATION
           ========================================================= */
        .site-header {
            background-color: #EAD5D5;
            border-bottom: 2.5px solid var(--retro-border);
            z-index: 40;
        }
        @media (min-width: 768px) {
            .site-header {
                position: sticky;
                top: 0;
            }
        }
        .container {
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding-left: 16px;
            padding-right: 16px;
        }
        @media (min-width: 640px) {
            .container { padding-left: 24px; padding-right: 24px; }
        }

        .tab-bar {
            padding-top: 8px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .tab-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dots {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 13px;
            height: 13px;
            border-radius: 9999px;
            border: 2px solid var(--retro-border);
            display: inline-block;
        }
        .dot-sm {
            width: 10px;
            height: 10px;
            border-radius: 9999px;
            border: 1.5px solid var(--retro-border);
            display: inline-block;
        }
        .active-tab {
            background-color: #F9ECEC;
            border-top: 2.5px solid var(--retro-border);
            border-left: 2.5px solid var(--retro-border);
            border-right: 2.5px solid var(--retro-border);
            padding: 6px 14px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-family: var(--font-pixel);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
            position: relative;
            margin-bottom: -2.5px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge-top {
            display: none;
            align-items: center;
            background-color: #D64527;
            color: #FFFFFF;
            border: 2px solid var(--retro-border);
            padding: 2px 12px;
            font-family: var(--font-pixel);
            font-size: 11px;
            letter-spacing: 0.04em;
            box-shadow: 2px 2px 0px #231F20;
        }
        .win-controls {
            display: none;
            align-items: center;
            gap: 4px;
        }
        .win-btn {
            width: 24px;
            height: 24px;
            border: 2px solid var(--retro-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-pixel);
            font-size: 12px;
            font-weight: 700;
        }
        @media (min-width: 640px) {
            .win-controls { display: flex; }
        }
        @media (min-width: 768px) {
            .status-badge-top { display: flex; }
        }

        .address-bar-wrap {
            background-color: #F9ECEC;
            border-top: 2.5px solid var(--retro-border);
            padding: 10px 0;
        }
        .address-bar-inner {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        @media (min-width: 1024px) {
            .address-bar-inner {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }
        .url-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .refresh-btn {
            padding: 6px 9px;
            background: #FFFFFF;
            border: 2px solid var(--retro-border);
            border-radius: 4px;
            font-family: var(--font-pixel);
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .refresh-btn:hover { background-color: var(--retro-pink); }
        .url-pill {
            flex: 1;
            min-width: 0;
            background: #FFFFFF;
            border: 2px solid var(--retro-border);
            border-radius: 9999px;
            padding: 5px 14px;
            font-family: var(--font-mono);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .url-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #1f2937;
        }
        .verified-pill {
            font-size: 10px;
            font-family: var(--font-pixel);
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #047857;
            padding: 2px 8px;
            border-radius: 9999px;
            flex-shrink: 0;
        }
        .mail-btn {
            padding: 6px 8px;
            background-color: #84A59D;
            color: #FFFFFF;
            border: 2px solid var(--retro-border);
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .nav-menu {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .nav-link {
            padding: 5px 10px;
            border-radius: 4px;
            font-family: var(--font-pixel);
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* =========================================================
           MAIN LAYOUT & GRIDS
           ========================================================= */
        main {
            flex: 1;
            padding-top: 28px;
            padding-bottom: 32px;
        }
        .section-space > section + section {
            margin-top: 44px;
        }

        /* Section 1 Grid */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
            align-items: start;
        }
        @media (min-width: 1024px) {
            .profile-grid {
                grid-template-columns: 7fr 5fr;
            }
        }

        .window-bar {
            border-bottom: 2px solid var(--retro-border);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .mini-url-bar {
            background-color: #ECECEC;
            border-bottom: 2px solid var(--retro-border);
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mini-url-pill {
            background: #FFFFFF;
            border: 1px solid var(--retro-border);
            border-radius: 9999px;
            padding: 2px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .hearts-strip {
            padding: 10px 16px 4px;
            color: #FFFFFF;
            font-family: var(--font-pixel);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            user-select: none;
        }

        /* Inner Profile Card Grid */
        .profile-card-body {
            padding: 8px 16px 16px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 640px) {
            .profile-card-body {
                grid-template-columns: 4fr 3fr 5fr;
                align-items: stretch;
            }
        }

        .photo-header {
            background-color: #F4A261;
            border: 2px solid var(--retro-border);
            text-align: center;
            font-family: var(--font-pixel);
            font-size: 12px;
            font-weight: 700;
            padding: 4px;
        }
        .photo-frame-outer {
            background: #FFFFFF;
            border-left: 2px solid var(--retro-border);
            border-right: 2px solid var(--retro-border);
            border-bottom: 2px solid var(--retro-border);
            padding: 8px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-box {
            width: 100%;
            max-width: 240px;
            aspect-ratio: 3 / 4;
            background-color: #F9ECEC;
            border: 2px solid var(--retro-border);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .badge-tl {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(255,255,255,0.92);
            border: 1px solid var(--retro-border);
            padding: 2px 6px;
            font-family: var(--font-pixel);
            font-size: 10px;
            box-shadow: 2px 2px 0px #231F20;
        }
        .badge-br {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: #E9C46A;
            border: 1px solid var(--retro-border);
            padding: 2px 6px;
            font-family: var(--font-pixel);
            font-size: 10px;
        }

        .meta-col {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            color: #FFFFFF;
        }
        .meta-tag {
            display: inline-block;
            background: #FFFFFF;
            color: var(--retro-border);
            border: 2px solid var(--retro-border);
            font-family: var(--font-pixel);
            font-size: 10px;
            padding: 2px 6px;
            font-weight: 700;
        }

        .spec-box {
            border: 2px solid var(--retro-border);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }
        .spec-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--retro-border);
            padding: 5px 8px;
        }
        .copy-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .copy-btn {
            background: #FFFFFF;
            border: 2px solid var(--retro-border);
            padding: 6px 8px;
            font-family: var(--font-pixel);
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
        }
        .copy-btn:hover { background-color: #fef3c7; }

        .right-col-stack {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .contact-links {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 2px dashed rgba(35, 31, 32, 0.35);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
        }
        .contact-pill {
            background: #FFFFFF;
            border: 1px solid var(--retro-border);
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            color: var(--retro-border);
            word-break: break-all;
        }
        .contact-pill:hover { background-color: rgba(229, 152, 155, 0.3); }
        .contact
